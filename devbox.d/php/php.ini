[php]

; Put your php.ini directives here. For the latest default php.ini file, see https://github.com/php/php-src/blob/master/php.ini-production

; memory_limit = 128M
; expose_php = Off

; Templates render into an output buffer that the tests parse as XML or JSON, so
; a displayed deprecation notice lands inside the document and the parse fails.
; Production and CI both leave this off; matching them keeps the local suite honest.
display_errors = Off

xdebug.mode = debug
xdebug.discover_client_host = true
