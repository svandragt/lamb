name: Release artifacts

# Builds the no-Composer install artifacts for each published release:
# - lamb-<version>.tar.gz with vendor/ bundled, attached to the GitHub Release
# - ghcr.io/svandragt/lamb:<version> Docker image (and :latest for final releases)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build artifacts for'
        required: true

env:
  TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  tarball:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: sqlite3, gettext, simplexml

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-scripts --optimize-autoloader

      - name: Build tarball
        run: |
          mkdir -p build/lamb
          cp -r src vendor composer.json composer.lock make-password.php README.md LICENSE build/lamb/
          # Runtime dirs (data/, src/assets/) are deliberately not shipped:
          # extracting them over a live install would reset their ownership.
          rm -rf build/lamb/src/assets
          tar -czf "lamb-${TAG}.tar.gz" -C build lamb

      - name: Attach tarball to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "lamb-${TAG}.tar.gz" --clobber

  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TAG }}

      - name: Determine whether this is a pre-release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Build into the local daemon rather than pushing straight away, so the
      # image can be scanned before it is published.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: .docker/Dockerfile.release
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG }}

      # `composer audit` (in CI) only covers PHP packages. This catches CVEs in
      # the OS and PHP layers of the frankenphp base image, which is what users
      # actually run. ignore-unfixed keeps releases from being blocked by base
      # image CVEs that have no patch available yet.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Trivy auto-discovers only a plain .trivyignore, so drop this line
          # and every suppression in the YAML file silently stops applying.
          trivyignores: .trivyignore.yaml
          exit-code: '1'

      - name: Push image
        run: |
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          if [ "${{ steps.meta.outputs.prerelease }}" = 'false' ]; then
            docker tag "ghcr.io/${GITHUB_REPOSITORY}:${TAG}" "ghcr.io/${GITHUB_REPOSITORY}:latest"
            docker push "ghcr.io/${GITHUB_REPOSITORY}:latest"
          fi
