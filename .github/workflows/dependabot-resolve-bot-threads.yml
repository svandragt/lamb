# The branch rulesets require every review thread to be resolved before merge.
# Patch and minor Dependabot updates are trusted to auto-merge, so cubic's
# threads on those PRs are resolved here when cubic reviews them, and by
# dependabot-auto-merge.yml when cubic reviewed before auto-merge was enabled.
# Majors are left for a person.
name: Dependabot resolve bot threads

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.review.user.login == 'cubic-dev-ai[bot]'
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

  resolve-threads:
    needs: metadata
    if: needs.metadata.outputs.update-type != 'version-update:semver-major'
    runs-on: ubuntu-latest

    steps:
      # Run the script from the default branch, not the PR's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve cubic threads
        run: scripts/resolve-cubic-threads.sh "$OWNER" "$REPO" "$PR_NUMBER"
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
