# The branch rulesets require every review thread to be resolved before merge.
# Patch and minor Dependabot updates are trusted to auto-merge, so cubic's
# threads on those PRs are resolved here. Majors are left for a person.
name: Dependabot resolve bot threads

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve-threads:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.review.user.login == 'cubic-dev-ai[bot]'

    steps:
      # Run the script from the default branch, not the PR's merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve cubic threads when auto-merge is enabled
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR_NUMBER" --json autoMergeRequest --jq '.autoMergeRequest == null')" = true ]; then
            echo "Auto-merge is not enabled (major update); leaving threads for a person."
            exit 0
          fi
          scripts/resolve-cubic-threads.sh "$OWNER" "$REPO" "$PR_NUMBER"
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
