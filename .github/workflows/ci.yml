name: CI

permissions:
  checks: write
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ "main", "release" ]
  pull_request:

jobs:

  # Detect whether files relevant to the browser (Playwright) suite changed.
  # The workflow itself always runs (no `paths:` filter on the triggers above)
  # so the required `ci` check is always reported; the expensive playwright job
  # below is what we gate on these paths, keeping doc-only PRs fast.
  changes:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            e2e:
              - 'src/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'

  # A PR into main that changes shipped code needs a changelog fragment (see
  # changelog.d/README.md) unless it carries the `no-changelog` label. Labels
  # and files come from the API, not the event payload, so adding the label and
  # re-running the failed jobs takes effect. PRs into other branches (the
  # main -> release promotion) are skipped: their diff spans a whole release.
  # The first step runs the release assembly in dry-run mode, so an empty or
  # malformed fragment fails here and not at release time.
  changelog:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate fragments
        run: |
          if [ -n "$(find changelog.d -name '*.md' ! -name README.md)" ]; then
            scripts/changelog-assemble.sh 0.0.0 --dry-run >/dev/null
          fi
      - name: Require a changelog fragment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
        run: |
          labels=$(gh api "$PR_API" --jq '.labels[].name')
          if grep -qx 'no-changelog' <<<"$labels"; then
            echo "Labelled no-changelog; nothing to check."
            exit 0
          fi
          # jq prints the words "code" and "fragment", never a file name: a path can
          # contain a newline and forge a line. A rename counts its old path too, so
          # moving code out of src/ still needs a fragment.
          flags=$(gh api "$PR_API/files" --paginate --jq '
            .[]
            | (if ([.filename, .previous_filename] | map(select(. != null and test("\\A(src|bin)/"))) | length) > 0 then "code" else empty end),
              (if .status != "removed" and (.filename | test("\\Achangelog\\.d/[A-Za-z0-9_-]+\\.(added|changed|deprecated|removed|fixed|security)\\.md\\z")) then "fragment" else empty end)')
          if ! grep -qx 'code' <<<"$flags"; then
            echo "No changes under src/ or bin/; nothing to check."
            exit 0
          fi
          if ! grep -qx 'fragment' <<<"$flags"; then
            echo "::error::This PR changes src/ or bin/ without a changelog fragment. Add changelog.d/<name>.<type>.md (see changelog.d/README.md), or add the no-changelog label and re-run the failed jobs."
            exit 1
          fi
          echo "Changelog fragment found."

  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'

      - uses: ./.github/actions/setup-viv

      - name: Install dependencies
        run: viv install --no-progress

      - name: Validate manifest
        run: viv validate

      - name: Security audit
        run: viv audit

      - name: Run PHPCS
        run: viv run lint

      - name: Run PHPStan
        run: viv run analyse

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: [ '8.4', '8.5' ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: ${{ matrix.php-version == '8.5' && 'pcov' || 'none' }}

      - uses: ./.github/actions/setup-viv

      - name: Install dependencies
        run: viv install --no-progress

      # GITHUB_REF is quoted, and reached through env: rather than interpolated
      # into the script. git allows `'`, `;`, `&`, `|` and `$( )` in a ref name
      # (check-ref-format only forbids space, `~^:?*[`, control characters and a
      # few shapes), so an unquoted expansion here made the ref name shell
      # syntax: `refs/heads/a$(id)` ran `id`. Reaching it needs push access —
      # a pull_request run gets `refs/pull/N/merge` — so this is hardening
      # rather than an open hole, but it costs one quote pair.
      - name: Run Codeception tests
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          LAMB_WRITE_TEST_PASSWORD=1 php make-password.php "$GIT_REF"
          vendor/bin/codecept run --steps

      - name: Check code coverage
        if: matrix.php-version == '8.5'
        # Not `viv run coverage`: viv runs scripts on the static PHP that
        # config.platform.php pins, which has no coverage driver.
        run: |
          vendor/bin/codecept run Unit --coverage-xml
          php check-coverage.php tests/_output/coverage.xml 70

  # Client-side JavaScript unit tests (node:test + jsdom). Fast and
  # dependency-light, so it always runs and feeds the aggregate `ci` gate.
  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Mirrors `viv audit` in the quality job for the JS side. Every JS
      # dependency here is a devDependency, so an advisory affects CI runners
      # and dev machines rather than a deployed site — hence the `high`
      # threshold instead of viv audit's fail-on-anything. Dependabot
      # alerts still surface the lower-severity ones.
      - name: Security audit
        run: pnpm audit --audit-level=high
      - name: Run JS tests
        run: pnpm test

  # Browser end-to-end suite. Only runs when e2e-relevant files change
  # (see the `changes` job); otherwise it is skipped and the gate below
  # treats that as a pass.
  playwright:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: sqlite3, gettext, simplexml
      - uses: ./.github/actions/setup-viv
      - name: Cache viv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: vendor
          key: viv-${{ hashFiles('composer.lock') }}
      - name: Install viv dependencies
        run: viv install --no-dev --no-scripts
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Run Playwright tests
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Single aggregate gate. Mark THIS job ("ci") as the required status check
  # in branch protection / the ruleset — not the individual matrix jobs.
  # `if: always()` ensures the job runs (and reports a definite success/failure)
  # even when a dependency fails. Without it the job would be *skipped* when
  # a dependency fails, and GitHub treats a skipped required check as
  # passing — which would let a red PR merge.
  ci:
    runs-on: ubuntu-latest
    needs: [quality, test, js-test, playwright, changelog]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "quality:    ${{ needs.quality.result }}"
          echo "test:       ${{ needs.test.result }}"
          echo "js-test:    ${{ needs.js-test.result }}"
          echo "playwright: ${{ needs.playwright.result }}"
          echo "changelog:  ${{ needs.changelog.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.js-test.result }}" != "success" ]; then
            echo "::error::quality, test or js-test did not succeed"
            exit 1
          fi
          # playwright is skipped on PRs that don't touch e2e-relevant paths;
          # only a real failure (or cancellation) should block the merge.
          if [ "${{ needs.playwright.result }}" != "success" ] && [ "${{ needs.playwright.result }}" != "skipped" ]; then
            echo "::error::playwright did not succeed"
            exit 1
          fi
          # changelog only runs on PRs into main; skipped elsewhere.
          if [ "${{ needs.changelog.result }}" != "success" ] && [ "${{ needs.changelog.result }}" != "skipped" ]; then
            echo "::error::changelog did not succeed"
            exit 1
          fi
          echo "All checks passed"
